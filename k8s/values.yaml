# Harness values file — the ONLY place bare <+...> expressions belong.
#
# In this install Harness does NOT render bare <+...> expressions found in raw
# K8s manifests (they get applied literally — the ConfigMap once shipped the
# string "<+pipeline.variables.FAILURE_MODE>" to the pod, which broke the app
# and tripped a canary rollback). The reliable pattern is: keep every <+...>
# expression HERE, and reference it from the manifests via Go templating
# (the Values placeholders). Harness resolves the expressions in this file, then renders
# the manifests. Wire this file into the Service manifest's "Values.yaml" slot.
#
# - image:       Service Primary Artifact (DockerHub squiggie/ai-agent:<+pipeline.sequenceId>)
# - failureMode: THE demo toggle, now a per-STAGE variable <+stage.variables.FAILURE_MODE>
#                (defined on each CD stage — DEV/UAT/PRD — as a runtime input, so each
#                environment gets its own value; no longer a pipeline variable). Picked at
#                Run time (none/healthz_500/latency/crash_on_start/bad_agent).
# - gcpProject / gcpLocation: portable GCP wiring, set once in Pipeline → Variables
# - llmProvider: "vertex" in-cluster (Workload Identity) or "stub" for no-GCP runs
# - namespace:   the deploying Infrastructure Definition's namespace, so the SAME
#                manifests deploy to a per-Environment namespace (ai-agent-dev /
#                ai-agent-uat / ai-agent-prd) on the one shared GKE cluster.
#                Harness resolves <+infra.namespace> to that Infra Definition's
#                namespace per stage; every manifest references it via
#                {{.Values.namespace}} (metadata.namespace, and the Namespace
#                object's metadata.name).
image:       <+artifact.image>
failureMode: <+stage.variables.FAILURE_MODE>
gcpProject:  <+pipeline.variables.GOOGLE_CLOUD_PROJECT>
gcpLocation: <+pipeline.variables.GOOGLE_CLOUD_LOCATION>
llmProvider: <+pipeline.variables.LLM_PROVIDER>
namespace:   <+infra.namespace>
