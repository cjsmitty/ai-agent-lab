# App configuration. FAILURE_MODE is THE demo toggle. Its value — and the LLM
# wiring below — come from k8s/values.yaml: Harness resolves the <+...>
# expressions THERE (bare <+...> in a raw manifest is applied literally in this
# install and breaks the app), then Go templating injects the resolved values
# here via {{.Values.*}}. Flipping FAILURE_MODE (values.yaml key `failureMode`,
# picked at Run time) deploys the SAME image healthy or broken so the canary
# goes unhealthy → Harness auto-rolls-back.
# NOTE: the {{.Values.*}} placeholders below are NOT valid for a plain
# `kubectl apply` outside Harness — substitute literal values first.
#   none | healthz_500 | crash_on_start | latency | bad_agent
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-config
  namespace: ai-agent
  labels:
    app: ai-agent
data:
  # Demo toggle — from values.yaml key `failureMode` (Harness resolves
  # <+pipeline.variables.FAILURE_MODE> there; Go templating injects it here).
  # For a manual `kubectl` deploy, replace with a literal ("none" = healthy).
  FAILURE_MODE: "{{.Values.failureMode}}"

  # Shown by GET /version and the UI status bar so the on-screen flavor label
  # flips visibly between deploys (e.g. "stable" vs "canary-broken").
  BUILD_FLAVOR: "stable"

  # LLM wiring — from values.yaml key `llmProvider`. "vertex" is the point of
  # Workload Identity in-cluster; "stub" runs without any Vertex AI access (no
  # GCP calls at all) for no-GCP local runs. Set once in Pipeline → Variables
  # (vertex for this install). Manual `kubectl` deploy: substitute a literal.
  LLM_PROVIDER: "{{.Values.llmProvider}}"

  # GCP project/location — from values.yaml keys `gcpProject`/`gcpLocation` so
  # the demo is portable: a forker sets these once in Pipeline → Variables as
  # fixed-value defaults (harness-lab-502401 / us-central1 for this install),
  # no code change. Manual `kubectl` deploy: substitute a literal project/region.
  GOOGLE_CLOUD_PROJECT: "{{.Values.gcpProject}}"
  GOOGLE_CLOUD_LOCATION: "{{.Values.gcpLocation}}"
  GEMINI_MODEL: "gemini-2.0-flash"
