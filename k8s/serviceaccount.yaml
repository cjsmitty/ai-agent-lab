# Kubernetes ServiceAccount bound to the GCP service account via
# Workload Identity — this is how the pod calls Vertex AI with NO API keys.
#
# The names here MUST stay in sync with terraform/ (shared conventions in
# CLAUDE.md): KSA `ai-agent-sa` in namespace `ai-agent`, GCP SA `ai-agent-app`.
# Terraform creates the google_service_account and the
# roles/iam.workloadIdentityUser binding for
#   serviceAccount:PROJECT_ID.svc.id.goog[ai-agent/ai-agent-sa]
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent-sa
  namespace: ai-agent
  labels:
    app: ai-agent
  annotations:
    # Project id comes from k8s/values.yaml key `gcpProject` (Harness resolves
    # <+pipeline.variables.GOOGLE_CLOUD_PROJECT> there; Go templating injects it
    # here). A bare <+...> or a literal PROJECT_ID placeholder would be applied
    # verbatim and silently break Workload Identity, so keep it templated.
    # GCP SA name (ai-agent-app) and KSA name (ai-agent-sa) are fixed — must
    # match terraform/. Manual `kubectl` deploy: substitute a literal project id.
    iam.gke.io/gcp-service-account: ai-agent-app@{{.Values.gcpProject}}.iam.gserviceaccount.com
