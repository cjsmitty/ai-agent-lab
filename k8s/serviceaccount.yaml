# Kubernetes ServiceAccount bound to the GCP service account via
# Workload Identity — this is how the pod calls Vertex AI with NO API keys.
#
# The names here MUST stay in sync with terraform/ (shared conventions in
# CLAUDE.md): KSA `ai-agent-sa` in namespace `ai-agent`, GCP SA `ai-agent-app`.
# Terraform creates the google_service_account and the
# roles/iam.workloadIdentityUser binding for
#   serviceAccount:PROJECT_ID.svc.id.goog[ai-agent/ai-agent-sa]
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent-sa
  namespace: ai-agent
  labels:
    app: ai-agent
  annotations:
    # PLACEHOLDER: replace PROJECT_ID with your GCP project id
    # (terraform output, or patch it from a Harness variable / sed at deploy time).
    iam.gke.io/gcp-service-account: ai-agent-app@PROJECT_ID.iam.gserviceaccount.com
